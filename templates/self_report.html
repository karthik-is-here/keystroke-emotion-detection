{% extends "base.html" %}
{% block title %}How did that make you feel?{% endblock %}
{% block content %}
  <h1>How did that make you feel?</h1>
  <p class="lead">Choose the option that best matches how you feel right now.</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="POST" action="{{ url_for('self_report') }}">
    <div class="field radio-list">
      {% for label in labels %}
        <label>
          <input type="radio" name="emotion" value="{{ label }}" required>
          {{ label | capitalize }}
        </label>
      {% endfor %}
    </div>
    <div class="actions">
      <button type="submit">Continue</button>
    </div>
  </form>
{% endblock %}
