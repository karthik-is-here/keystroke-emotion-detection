{% extends "base.html" %}
{% block title %}A quick question{% endblock %}
{% block content %}
  <h1>{{ question }}</h1>
  <p class="lead">
    Answer in a couple of sentences, at your normal typing pace.
  </p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="POST" action="{{ url_for('baseline') }}" id="baseline-form">
    <div class="field">
      <textarea id="text_content" name="text_content" required
                placeholder="Start typing your answer..."></textarea>
    </div>
    <div class="word-count" id="word_count"></div>

    <input type="hidden" id="keystroke_data" name="keystroke_data">
    <input type="hidden" id="duration_ms" name="duration_ms">

    <div class="actions">
      <button type="submit" id="submit_btn" disabled>Continue</button>
    </div>
  </form>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/keystroke.js') }}"></script>
  <script>
    setupTypingForm({
      textareaId: "text_content",
      formId: "baseline-form",
      wordCountId: "word_count",
      submitId: "submit_btn",
      minWords: {{ min_words }},
    });
  </script>
{% endblock %}
